<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2447"><title>SNOWRUSH</title></head><body>
<canvas id="c"></canvas><div id="lines"></div>
<div id="hud" class="hide"><div class="sc"><small>SCORE</small><b id="score">0</b><i id="mult"></i></div>
<div class="st"><span>DIST <b id="dist">0</b>m</span><span>SPEED <b id="speed">0</b></span><span>❄ <b id="coins">0</b></span><span>BEST <b id="best">0</b></span></div></div>
<div id="pop"></div>
<div id="menu"><h1 id="logo"></h1><p id="tag"></p><button id="playBtn" class="btn">PLAY</button>
<div class="how"><span><kbd>A</kbd><kbd>D</kbd> / ◀ ▶ steer</span><span><kbd>SPACE</kbd> jump</span><span>📱 hold left/right · swipe up</span></div>
<p class="bst">BEST <b id="best1">0</b></p><p class="rot">For the best experience, rotate your phone.</p></div>
<div id="over" class="hide"><h2>GAME OVER</h2><div id="nb" class="hide">NEW BEST!</div>
<div class="grid"><span>Score<b id="oScore"></b></span><span>Distance<b id="oDist"></b></span><span>Snowflakes<b id="oCoins"></b></span><span>Best combo<b id="oCombo"></b></span></div>
<p class="bst">BEST <b id="oBest"></b></p><button id="againBtn" class="btn">PLAY AGAIN</button></div>
<button id="mute" aria-label="sound">🔊</button><div id="fade"></div>
<script type="module" src="/src/main.js"></script></body></html>
